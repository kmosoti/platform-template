[workspace]
resolver = "3"
members = [
    "crates/platform-kernel",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
authors = ["Kennedy Mosoti"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
flate2 = "1.1"
platform-kernel = { path = "crates/platform-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
